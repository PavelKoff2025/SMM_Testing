<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMM Testing{% endblock %} · МИСИС</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">НИТУ&nbsp;МИСИС <span class="accent">·</span> SMM&nbsp;Testing</a>
      <span class="subtitle">Тестирование по курсу «Взаимодействие с социальными медиа»</span>
      <nav>
        <a href="/">Тесты</a>
        <a href="/student">Кабинет студента</a>
        <a href="/teacher">Кабинет преподавателя</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div>© Павел Кариков · Курс «Взаимодействие с социальными медиа» · SMM Testing</div>
  </footer>

  <script>
    // Индикатор долгих операций: формы с data-disable-on-submit блокируют
    // кнопку submit и меняют текст на «Подождите…», чтобы пользователь не кликал
    // повторно (AI-генерация ~15–20с, загрузка PDF). Без зависимостей.
    (function () {
      document.addEventListener('submit', function (e) {
        var f = e.target;
        if (!f || f.tagName !== 'FORM' || !f.hasAttribute('data-disable-on-submit')) return;
        var btn = f.querySelector('[type=submit]');
        if (!btn || btn.disabled) return;
        btn.setAttribute('data-label', btn.textContent.trim());
        btn.disabled = true;
        btn.textContent = 'Подождите…';
      }, true);
    })();
  </script>
</body>
</html>
